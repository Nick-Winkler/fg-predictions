name: fgp

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?missing username for DB in env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing password for DB in env file}
      POSTGRES_DB: ${POSTGRES_DB:?missing db name in env file}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 3

volumes:
  pgdata: